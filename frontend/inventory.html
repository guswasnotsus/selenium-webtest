<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .products {
            display: flex;
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<header>
    <h1>Inventory</h1>
</header>

<div class="container">

    <h2>Products</h2>

    <div class="products">

        <div class="product">
            <h3>Product 1</h3>
            <p>$29.99</p>
        </div>

        <div class="product">
            <h3>Product 2</h3>
            <p>$49.99</p>
        </div>

        <div class="product">
            <h3>Product 3</h3>
            <p>$19.99</p>
        </div>

    </div>

</div>

</body>
</html>
