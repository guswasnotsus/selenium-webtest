<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Login Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: #d9534f;
            background: #f8d7da;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .credentials {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <div id="error-message"
         class="error"
         data-test="error">
        Username or password is incorrect.
    </div>

    <form id="login-form">

        <input
            type="text"
            id="user-name"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            type="submit"
            id="login-button">
            Login
        </button>

    </form>

    <div class="credentials">
        <strong>Test Credentials</strong><br>
        Username: standard_user<br>
        Password: secret_sauce
    </div>

</div>

<script>
    const loginForm = document.getElementById("login-form");
    const username = document.getElementById("user-name");
    const password = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const enteredUsername = username.value;
        const enteredPassword = password.value;

        if (
            enteredUsername === "standard_user" &&
            enteredPassword === "secret_sauce"
        ) {
            // Successful login
            window.location.href = "inventory.html";

        } else {
            // Failed login
            errorMessage.style.display = "block";
        }
    });
</script>

</body>
</html>
